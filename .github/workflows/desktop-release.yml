name: Transfer verified desktop release
on:
  workflow_dispatch:
    inputs:
      config_asset_id:
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_RELEASE_TOKEN: ${{ secrets.DRKOZOL_RELEASE_150_DESKTOP_TOKEN }}
          CONFIG_ASSET_ID: ${{ inputs.config_asset_id }}
        run: python3 tools/stage_desktop_release.py
