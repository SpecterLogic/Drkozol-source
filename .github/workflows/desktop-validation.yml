name: Final desktop 1.5.0 validation
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
      - name: Restore byte-verified unchanged native engines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v1.5.0 -R SpecterLogic/Drkozol --pattern 'DrKozol-1.5.0-windows-x64.zip' --dir artifacts/base
          if ((Get-FileHash artifacts/base/DrKozol-1.5.0-windows-x64.zip -Algorithm SHA256).Hash -ne '366492c44df05325e1269b45a3562abd4a6fae5468786499eb82a061f8259b4d') { throw 'Native base archive mismatch' }
          Expand-Archive artifacts/base/DrKozol-1.5.0-windows-x64.zip artifacts/base/extracted
          Copy-Item artifacts/base/extracted/DrKozol artifacts/windows -Recurse
      - name: Publish current desktop code against unchanged native inputs
        run: dotnet publish Windows/v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - name: Run all desktop unit tests
        env:
          DRKOZOL_CONFIG_VALIDATION_OUTPUT: ${{ github.workspace }}/artifacts/tun-checks
        run: dotnet run --project Windows/v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release
      - name: Validate native tunnel configurations
        shell: pwsh
        run: |
          Get-ChildItem artifacts/tun-checks/*.json | ForEach-Object {
            & artifacts/windows/bin/sing_box/sing-box.exe check -c $_.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Native tunnel configuration rejected' }
          }
      - name: Verify current UI, test cancellation, HTTPS, balancer and administrator TUN
        shell: pwsh
        env:
          DRKOZOL_TEST_URL: ${{ secrets.DRKOZOL_TEST_URL_150_DESKTOP }}
          DRKOZOL_TEST_TUN: '1'
          DRKOZOL_SKIP_AWG_TEST: '1'
        run: |
          Copy-Item artifacts/windows artifacts/windows-smoke -Recurse
          $taskProcess = Start-Process artifacts/windows-smoke/DrKozol.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru -Wait
          Get-Content artifacts/windows-smoke/smoke-result.json
          if ($taskProcess.ExitCode -ne 0) { throw 'Windows runtime validation failed' }
      - name: Stage only the checked clean Windows package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: '427322210'
        run: python tools/stage_desktop_validation.py windows

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
      - run: sudo apt-get update && sudo apt-get install -y xvfb fonts-dejavu-core libgtk-3-0 libcap2-bin dbus-x11 gsettings-desktop-schemas openbox xdotool x11-utils
      - name: Restore byte-verified unchanged Linux native engines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.5.0 -R SpecterLogic/Drkozol --pattern 'DrKozol-1.5.0-linux-x64.tar.gz' --dir artifacts/base
          echo '7288846416b2fb3cd3cf74fe68d13651491fc5606ba702cf4a3d8a103a479dd9  artifacts/base/DrKozol-1.5.0-linux-x64.tar.gz' | sha256sum -c
          mkdir -p artifacts/base/extracted
          tar -xzf artifacts/base/DrKozol-1.5.0-linux-x64.tar.gz -C artifacts/base/extracted
          cp -a artifacts/base/extracted/DrKozol artifacts/linux
      - name: Publish current Linux desktop code
        run: dotnet publish Windows/v2rayN/v2rayN.Desktop/v2rayN.Desktop.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/linux
      - name: Test Linux desktop helpers
        run: dotnet run --project Windows/v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release -- --treenode-filter '/*/ServiceLib.Tests.DrKozol/*/*'
      - name: Preserve clean files and package
        run: |
          mkdir -p artifacts/linux-public
          cp -a artifacts/linux/. artifacts/linux-public/
          python3 tools/package_linux.py artifacts/linux-public
      - name: Verify Linux UI, test cancellation, sorting, HTTPS and balancer
        env:
          DRKOZOL_TEST_URL: ${{ secrets.DRKOZOL_TEST_URL_150_DESKTOP }}
          DRKOZOL_TEST_GNOME: '1'
        run: xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- artifacts/linux/DrKozol --smoke-test
      - name: Verify ordinary-user TUN DNS and HTTPS
        env:
          DRKOZOL_TEST_URL: ${{ secrets.DRKOZOL_TEST_URL_150_DESKTOP }}
          DRKOZOL_TEST_TUN: '1'
        run: |
          sudo sh Linux/install-tun.sh artifacts/linux
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- artifacts/linux/DrKozol --smoke-test
      - name: Verify installed Debian package
        run: |
          sudo dpkg -i artifacts/packages/DrKozol-*-linux-amd64.deb
          mkdir -p artifacts/linux-deb-validation artifacts/installed-user-data
          XDG_DATA_HOME="$PWD/artifacts/installed-user-data" DRKOZOL_SMOKE_OUTPUT="$PWD/artifacts/linux-deb-validation" xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- /usr/bin/DrKozol --smoke-test
          test -f artifacts/installed-user-data/DrKozol/guiConfigs/guiNConfig.json
          test ! -d /opt/DrKozol/guiConfigs
      - name: Verify portable and installed close, reopen and forced-exit recovery
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- python3 tools/check_linux_lifecycle.py artifacts/linux-public/DrKozol --output artifacts/linux-lifecycle/portable.json
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- python3 tools/check_linux_lifecycle.py /usr/bin/DrKozol --output artifacts/linux-lifecycle/installed.json
      - name: Stage only checked clean Linux packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: '427322210'
        run: python3 tools/stage_desktop_validation.py linux
