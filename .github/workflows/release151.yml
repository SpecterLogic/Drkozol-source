name: Stage Android Windows and source 1.5.1
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  SOURCE_RELEASE_ID: '428149341'
  APP_RELEASE_ID: '428149312'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'dfb75f74669a615128e2ab9a514ba4e26de76751'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'
      - name: Restore exact source and native inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh release download v1.5.0-desktop -R SpecterLogic/Drkozol-source --pattern 'DrKozol-desktop-source-1.5.0.zip' --output artifacts/base-source.zip
          gh api 'repos/SpecterLogic/Drkozol-source/contents/tools/release151_cloud.py?ref=main' --jq '.content' | base64 -d > cloud151.py
          gh api 'repos/SpecterLogic/Drkozol-source/contents/tools/release151_manifest.json?ref=main' --jq '.content' | base64 -d > manifest151.json
          python3 cloud151.py prepare
          python3 cloud151.py source
          cat > mirror.gradle <<'EOF'
          beforeSettings { s -> s.pluginManagement.repositories { maven { url = uri('https://maven.aliyun.com/repository/google') }; gradlePluginPortal(); mavenCentral(); google() } }
          settingsEvaluated { s -> s.dependencyResolutionManagement.repositories { clear(); maven { url = uri('https://maven.aliyun.com/repository/google') }; mavenCentral(); google() } }
          EOF
      - name: Build and run JVM tests
        working-directory: V2rayNG
        run: chmod +x gradlew && ./gradlew -I ../mirror.gradle :app:testPlaystoreDebugUnitTest :app:assemblePlaystoreRelease :app:assemblePlaystoreDebug :app:assemblePlaystoreDebugAndroidTest --max-workers=2 --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: cd V2rayNG && ./gradlew -I ../mirror.gradle :app:connectedPlaystoreDebugAndroidTest --max-workers=2 --console=plain
      - name: Stage unsigned tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 cloud151.py unsigned
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android151-test-results
          path: |
            V2rayNG/app/build/test-results
            V2rayNG/app/build/outputs/androidTest-results
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'dfb75f74669a615128e2ab9a514ba4e26de76751'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.401'
      - name: Restore verified native inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release download v1.5.0 -R SpecterLogic/Drkozol --pattern 'DrKozol-1.5.0-windows-x64.zip' --dir artifacts/base
          if ((Get-FileHash artifacts/base/DrKozol-1.5.0-windows-x64.zip -Algorithm SHA256).Hash -ne '364be6997afd74f3a0ffa758e2d68c223997196ddcecd88f6616e2c16f01d842') { throw 'Native archive mismatch' }
          Expand-Archive artifacts/base/DrKozol-1.5.0-windows-x64.zip artifacts/base/extracted
          Copy-Item artifacts/base/extracted/DrKozol artifacts/windows -Recurse
          $payload=gh api 'repos/SpecterLogic/Drkozol-source/contents/tools/release151_cloud.py?ref=main' --jq '.content'
          [IO.File]::WriteAllBytes("$PWD/cloud151.py",[Convert]::FromBase64String(($payload -join '')))
      - run: dotnet publish Windows/v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/windows
      - run: dotnet run --project Windows/v2rayN/ServiceLib.Tests/ServiceLib.Tests.csproj -c Release
      - run: python cloud151.py windows-package
      - name: Check packaged UI
        shell: pwsh
        run: |
          Expand-Archive artifacts/DrKozol-1.5.1-windows-x64.zip artifacts/check
          $p=Start-Process artifacts/check/DrKozol/DrKozol.exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Packaged UI checks failed' }
      - name: Stage checked Windows package
        env:
          GH_TOKEN: ${{ secrets.DRKOZOL_RELEASE151_TOKEN }}
        run: python cloud151.py windows-upload
