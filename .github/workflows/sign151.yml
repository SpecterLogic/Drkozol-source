name: Stage locally signed Android 1.5.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ secrets.DRKOZOL_RELEASE151_TOKEN }}
          APP_RELEASE_ID: '428149312'
          SOURCE_RELEASE_ID: '428149341'
        run: python3 tools/release151_sign_stage.py
