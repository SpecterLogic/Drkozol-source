name: Stage locally signed Android 1.5.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ secrets.DRKOZOL_RELEASE151_TOKEN }}
          APP_RELEASE_ID: '428149312'
          SOURCE_RELEASE_ID: '428149341'
          SOURCE_SNAPSHOT: '6f27a7c1ee0ec90f180a6b74a5d2425fd8b3a45b'
          TESTED_SOURCE_SNAPSHOT: '5f17d371b7be0440c55edddda577caf129664a88'
        run: python3 tools/release151_sign_stage.py
